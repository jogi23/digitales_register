name: FlutterCi

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
  workflow_dispatch:
  release:
    types:
      - created
      - edited

jobs:

  check:
    name: Analyse & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup flutter
        # Pinned to the version the app is developed against, so a Flutter
        # release cannot turn the gate red on its own: a newer analyzer
        # brings new lints, and those belong in a deliberate bump, not in
        # whichever pull request happens to come first.
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Generate code
        # Neither the built_value classes nor the localisations are checked
        # in, so nothing analyses or compiles before this step.
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Analyze
        # Warnings and errors fail the run; the style hints the code base has
        # carried for years do not, or nothing would ever be green.
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Test
        # The golden comparisons skip themselves here — see
        # test/flutter_test_config.dart.
        run: flutter test --no-pub

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    # No point building what does not analyse or pass its tests.
    needs: check
    # The default token may only read; the last step publishes a release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup flutter
        # Pinned: the action has no master branch any more, which broke every
        # run since May.
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install linux app dependencies
        run: sudo apt-get update -y && sudo apt-get install -y ninja-build libgtk-3-dev dpkg-dev pkg-config libjsoncpp-dev libsecret-1-dev libcurl4-openssl-dev

      - name: Enable desktop support
        run: flutter config --enable-linux-desktop

      - name: Build Flutter app
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build linux -v

      - name: Build Tarball
        run: |
          cp linux/icon.png build/linux/x64/release/bundle/icon.png
          cp linux/digitales_register.desktop build/linux/x64/release/bundle/digitales_register.desktop
          cp linux/digitales_register.metainfo.xml build/linux/x64/release/bundle/digitales_register.metainfo.xml
          tar czf digitales_register-linux-x86_64.tar.gz -C build/linux/x64/release/bundle/ .
      - uses: svenstaro/upload-release-action@latest
        # A pull request must not overwrite the development build, and one
        # from a fork could not anyway: its token may only read.
        if: github.event_name != 'pull_request'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./digitales_register-linux-x86_64*
          file_glob: true
          prerelease: ${{ github.event_name != 'release' }}
          release_name: ${{ github.event_name == 'release' && github.event.release.name || 'Development Build' }}
          tag: ${{ github.event_name == 'release' && github.event.release.tag_name || 'continuous' }}
          overwrite: true

  build-ios:
    name: iOS
    # The only macOS runner in this workflow: everything Apple needs Xcode,
    # and Xcode only runs here. Free for public repositories.
    runs-on: macos-latest
    # No point building what does not analyse or pass its tests.
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Build Flutter app
        # Unsigned on purpose. This job proves the iOS side still compiles —
        # the pods resolve, the plugins have iOS implementations, the
        # deployment target is one Xcode accepts. Producing an installable
        # build needs a paid Apple Developer account, a signing certificate
        # and a provisioning profile; none of that exists yet, and none of it
        # is needed to catch a broken iOS build.
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build ios --release --no-codesign -v
