<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7c4dff">
<title>Monster-Mampf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3d2a5c;
    --soft: #7a6a99;
    --bg1: #b9a6ff;
    --bg2: #ffd6f0;
    --belt: #4a4a5e;
    --cookie: #e0a560;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Fredoka, 'Comic Sans MS', 'Trebuchet MS', system-ui, sans-serif; font-weight: 600; color: var(--ink);
    background: radial-gradient(circle at 20% 10%, #fff6 0 8%, transparent 9%), radial-gradient(circle at 85% 30%, #fff5 0 5%, transparent 6%), linear-gradient(180deg, var(--bg1), var(--bg2));
    min-height: 100dvh; overflow-x: hidden;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 4px solid #2f80ff; outline-offset: 3px; }
  .hidden { display: none !important; }
  .screen { min-height: 100dvh; padding: calc(12px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; animation: screenIn .45s cubic-bezier(.2, .9, .3, 1.2); }
  @keyframes screenIn { from { opacity: 0; transform: translateY(16px); } }

  .icon-btn { width: 52px; height: 52px; flex: none; border-radius: 16px; background: #fff; box-shadow: 0 5px 0 #d8cdf2; font-size: 26px; display: grid; place-items: center; }
  .icon-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #d8cdf2; }

  /* ---------- Menü ---------- */
  .menu-card { width: 100%; max-width: 640px; margin: auto 0; background: rgba(255, 255, 255, .92); border-radius: 36px; padding: 26px 20px 22px; box-shadow: 0 16px 0 rgba(124, 77, 255, .3), 0 30px 60px rgba(80, 40, 140, .25); text-align: center; display: flex; flex-direction: column; gap: 14px; }
  .menu-monsters { display: flex; justify-content: center; align-items: flex-end; gap: 10px; height: 120px; }
  .menu-monsters .monster { width: 92px; pointer-events: none; }
  .menu-monsters .monster:nth-child(2) { width: 112px; }
  h1 { margin: 0; font-size: clamp(42px, 10vw, 64px); line-height: 1; color: #7c4dff; text-shadow: 0 4px 0 #d9ccff; letter-spacing: 1px; }
  h1 span { color: #ff5ea8; text-shadow: 0 4px 0 #ffc9e1; }
  .tagline { margin: 0; color: var(--soft); font-size: 18px; }
  .level-title { margin: 6px 0 0; font-size: 16px; color: var(--soft); }
  .levels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .levels button { background: #f4f0ff; border: 3px solid #e2d9ff; border-radius: 18px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #6a5a8f; }
  .levels button b { font-size: 18px; }
  .levels button small { font-size: 13px; opacity: .85; }
  .levels button.active { background: linear-gradient(160deg, #9b7bff, #7c4dff); border-color: #5b30d6; color: #fff; box-shadow: 0 5px 0 #4a24b8; transform: translateY(-2px); }
  .best { color: #f5a400; font-size: 22px; letter-spacing: 3px; }
  .best .off { color: #e3dcef; }
  .big-btn { padding: 16px 20px; border-radius: 24px; font-size: 24px; font-weight: 700; color: #fff; background: linear-gradient(180deg, #ff86be, #ff4f9a); box-shadow: 0 8px 0 #c92f73; }
  .big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #c92f73; }
  .big-btn.alt { background: linear-gradient(180deg, #a98cff, #7c4dff); box-shadow: 0 8px 0 #4a24b8; }
  .hub-link { color: var(--soft); font-size: 16px; text-decoration: underline; text-underline-offset: 4px; }

  /* ---------- Spiel ---------- */
  .wrap { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .topbar { display: flex; align-items: center; gap: 8px; }
  .progress { flex: 1; min-height: 52px; display: flex; justify-content: center; align-items: center; gap: clamp(2px, 1vw, 7px); background: rgba(255, 255, 255, .85); border-radius: 16px; box-shadow: 0 5px 0 #d8cdf2; padding: 6px; }
  .progress i { width: clamp(16px, 5vw, 26px); aspect-ratio: 1; border-radius: 50%; background: #ece6f8; display: grid; place-items: center; font-style: normal; font-size: clamp(10px, 3.2vw, 16px); }
  .progress i.now { box-shadow: 0 0 0 3px #ff86be; background: #fff; animation: pulse 1.2s infinite; }
  .progress i.star, .progress i.ok { animation: stamp .45s cubic-bezier(.2, .9, .3, 1.6); }
  .progress i.star { background: #ffd23f; }
  .progress i.ok { background: #b8f0b0; }
  @keyframes pulse { 50% { transform: scale(1.18); } }
  @keyframes stamp { from { transform: scale(2.2); opacity: 0; } }
  .hint { min-height: 30px; text-align: center; font-size: clamp(16px, 4vw, 19px); color: var(--ink); }
  .hint.tip { color: #b35c00; }
  .hint.good { color: #2e7d32; }

  /* Fabrik mit Fließband */
  .factory { position: relative; height: 210px; border-radius: 28px; background: linear-gradient(180deg, #fff7fd, #ffe8f6); box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .05); overflow: hidden; }
  .machine { position: absolute; left: 10px; bottom: 34px; width: 92px; height: 120px; border-radius: 18px 18px 6px 6px; background: linear-gradient(180deg, #ffb347, #ff8a1f); box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .15); z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; gap: 6px; }
  .machine .label { font-size: 11px; color: #fff; letter-spacing: 1px; background: rgba(0, 0, 0, .18); padding: 2px 6px; border-radius: 6px; }
  .machine .gauge { width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 4px solid #8a4b00; position: relative; }
  .machine .gauge::after { content: ''; position: absolute; left: 50%; top: 50%; width: 2px; height: 12px; background: #e53935; transform-origin: 50% 0; animation: needle 1.4s ease-in-out infinite; }
  @keyframes needle { 0%, 100% { transform: rotate(140deg); } 50% { transform: rotate(220deg); } }
  .machine .chimney { position: absolute; top: -26px; right: 14px; width: 18px; height: 28px; background: #8a4b00; border-radius: 4px 4px 0 0; }
  .machine .hole { position: absolute; right: -2px; bottom: 6px; width: 30px; height: 46px; background: #5a3000; border-radius: 10px 0 0 10px; }
  .machine.shake { animation: shakeM .4s; }
  @keyframes shakeM { 20% { transform: translateX(-4px) rotate(-2deg); } 40% { transform: translateX(4px) rotate(2deg); } 60% { transform: translateX(-3px); } }
  .puff { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #fff; opacity: .9; animation: puff 1.4s ease-out forwards; z-index: 2; }
  @keyframes puff { to { transform: translate(18px, -60px) scale(2.2); opacity: 0; } }
  .belt { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: repeating-linear-gradient(90deg, var(--belt) 0 22px, #5d5d74 22px 44px); border-top: 5px solid #2f2f3d; background-size: 44px 100%; animation: beltRun 1s linear infinite; }
  .belt.stop { animation-play-state: paused; }
  @keyframes beltRun { to { background-position: 44px 0; } }
  .bin { position: absolute; right: 8px; bottom: 34px; width: 62px; height: 70px; border-radius: 6px 6px 14px 14px; background: linear-gradient(90deg, #8fa3b8, #b7c7d6, #8fa3b8); box-shadow: inset 0 6px 0 rgba(0, 0, 0, .15); z-index: 3; display: grid; place-items: center; font-size: 26px; }
  .bin::before { content: ''; position: absolute; top: -8px; left: -4px; right: -4px; height: 10px; border-radius: 6px; background: #6e8296; }
  .bin.bump { animation: shakeM .4s; }

  .cookie { position: absolute; bottom: 34px; left: 0; width: 104px; height: 104px; z-index: 2; will-change: transform; }
  .cookie .disc { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f6c98a, var(--cookie) 55%, #b97a3c); box-shadow: inset -6px -8px 0 rgba(0, 0, 0, .12), 0 6px 0 rgba(0, 0, 0, .12); animation: roll 2.4s linear infinite; }
  .cookie .disc i { position: absolute; width: 13px; height: 11px; border-radius: 40% 60% 50% 50%; background: #5a2e10; }
  @keyframes roll { to { transform: rotate(360deg); } }
  .cookie .task { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; border-radius: 14px; padding: 2px 8px; font-size: clamp(22px, 5.6vw, 28px); font-weight: 700; white-space: nowrap; box-shadow: 0 3px 0 rgba(0, 0, 0, .15); }
  .cookie.fall { animation: fall .7s ease-in forwards; }
  @keyframes fall { 30% { transform: var(--pos) translateY(-20px) rotate(-20deg); } 100% { transform: var(--pos) translate(30px, 80px) rotate(80deg) scale(.6); opacity: 0; } }

  /* Monster */
  .monsters { flex: 1; display: flex; justify-content: space-around; align-items: center; gap: 8px; padding-top: 40px; min-height: 240px; }
  .monster { position: relative; width: 31%; max-width: 170px; display: flex; flex-direction: column; align-items: center; transition: transform .2s; }
  .monster .bodyw { position: relative; width: 100%; transform-origin: 50% 100%; transform: scale(var(--fat, 1), 1); transition: transform .5s cubic-bezier(.3, 1.6, .5, 1); }
  .monster .body { position: relative; width: 100%; aspect-ratio: 1 / .95; border-radius: 48% 48% 42% 42% / 55% 55% 45% 45%; background: radial-gradient(circle at 35% 25%, var(--hi), var(--c) 55%, var(--dk)); box-shadow: inset -8px -10px 0 rgba(0, 0, 0, .1); animation: idle 2.2s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes idle { 50% { transform: translateY(-6px) scale(1.02, .98); } }
  .monster .horn { position: absolute; top: -14px; width: 22%; height: 26%; background: var(--dk); border-radius: 50% 50% 10% 10%; }
  .monster .horn.l { left: 14%; transform: rotate(-18deg); } .monster .horn.r { right: 14%; transform: rotate(18deg); }
  .monster .antenna { position: absolute; top: -26px; left: 50%; width: 4px; height: 26px; background: var(--dk); transform: translateX(-50%); }
  .monster .antenna::after { content: ''; position: absolute; top: -10px; left: -6px; width: 16px; height: 16px; border-radius: 50%; background: #ffe066; box-shadow: 0 0 10px #ffe066; }
  .monster .eyes { position: absolute; top: 14%; left: 0; right: 0; display: flex; justify-content: center; gap: 4%; }
  .monster .eye { position: relative; width: var(--eye, 28%); aspect-ratio: 1; background: #fff; border-radius: 50%; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .12); overflow: hidden; }
  .monster .eye i { position: absolute; left: 50%; top: 50%; width: 45%; aspect-ratio: 1; margin: -22.5% 0 0 -22.5%; border-radius: 50%; background: #22163a; transform: translate(var(--px, 0), var(--py, 0)); }
  .monster .eye i::after { content: ''; position: absolute; width: 35%; aspect-ratio: 1; border-radius: 50%; background: #fff; top: 15%; left: 18%; }
  .monster .lid { position: absolute; inset: 0; background: var(--c); transform: translateY(-100%); transition: transform .08s; }
  .monster.blink .lid { transform: translateY(0); }
  .monster .mouth { position: absolute; z-index: 2; left: 50%; top: 43%; width: 46%; height: 12%; transform: translateX(-50%); background: #4a1030; border-radius: 10px 10px 40px 40px; overflow: hidden; transition: height .15s, width .15s; }
  .monster .mouth::before { content: ''; position: absolute; top: 0; left: 12%; right: 12%; height: 8px; background: repeating-linear-gradient(90deg, #fff 0 9px, transparent 9px 14px); }
  .monster .mouth::after { content: ''; position: absolute; bottom: -6px; left: 30%; width: 40%; height: 14px; border-radius: 50%; background: #ff6b8f; }
  .monster.open .mouth { height: 30%; width: 56%; }
  .monster.chomp .mouth { animation: chomp .5s ease-in-out 2; }
  @keyframes chomp { 0%, 100% { height: 12%; } 50% { height: 26%; } }
  .monster .belly { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); min-width: 46%; background: #fff; border-radius: 14px; padding: 0 8px; line-height: 1.15; text-align: center; font-size: clamp(22px, 6.4vw, 36px); font-weight: 700; color: var(--ink); box-shadow: 0 4px 0 rgba(0, 0, 0, .15); }
  .monster .feet { display: flex; gap: 30%; margin-top: -8px; }
  .monster .feet i { width: 26px; height: 14px; border-radius: 14px 14px 6px 6px; background: var(--dk); }
  .monster .bubble { position: absolute; bottom: calc(100% + 18px); left: 50%; transform: translateX(-50%) scale(0); background: #fff; border-radius: 16px; padding: 6px 10px; font-size: 15px; line-height: 1.25; width: max-content; max-width: 128px; text-align: center; box-shadow: 0 4px 0 rgba(0, 0, 0, .12); transition: transform .2s cubic-bezier(.3, 1.6, .5, 1); z-index: 5; }
  .monster .bubble::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -8px; border: 8px solid transparent; border-top-color: #fff; }
  .monster .bubble.show { transform: translateX(-50%) scale(1); }
  .monster.nope .body { animation: nope .6s; }
  @keyframes nope { 20% { transform: rotate(-10deg); } 40% { transform: rotate(10deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(6deg); } }
  .monster.nope .mouth { height: 16%; }
  .monster.nope .mouth::after { bottom: -14px; height: 22px; }
  .monster.wave { animation: wave .7s ease-in-out infinite; }
  @keyframes wave { 50% { transform: translateY(-16px); } }
  .monster:active:not(.nope) .body { transform: scale(.96); }
  .monster.happy .body { animation: happy .6s ease 2; }
  @keyframes happy { 50% { transform: translateY(-20px) rotate(4deg); } }

  .crumb { position: fixed; width: 8px; height: 8px; border-radius: 40%; background: #b97a3c; pointer-events: none; z-index: 40; }

  /* ---------- Ende ---------- */
  .overlay { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(60, 30, 110, .45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .end-card { width: min(440px, 100%); background: #fff; border-radius: 36px; padding: 24px 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 16px 0 rgba(124, 77, 255, .35); animation: pop .5s cubic-bezier(.2, .9, .3, 1.5); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .end-card h2 { margin: 0; font-size: 36px; color: #7c4dff; }
  .end-stars { font-size: 56px; letter-spacing: 6px; }
  .end-stars span { color: #ece6f8; display: inline-block; }
  .end-stars span.on { color: #ffc400; text-shadow: 0 4px 0 #e09a00; animation: starIn .55s backwards cubic-bezier(.2, .9, .3, 1.8); }
  @keyframes starIn { from { transform: scale(0) rotate(-180deg); } }
  .end-card p { margin: 0; color: var(--soft); font-size: 18px; }
  .end-actions { display: flex; gap: 10px; }
  .end-actions .big-btn { flex: 1; font-size: 20px; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  @media (max-width: 420px) { .icon-btn { width: 44px; height: 44px; font-size: 22px; border-radius: 14px; } .progress { min-height: 44px; gap: 2px; padding: 4px; } .progress i { width: 14px; font-size: 9px; } .factory { height: 190px; } .cookie { width: 92px; height: 92px; } .machine { width: 78px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }

  /* ---------- Pause ---------- */
  body.paused *, body.paused *::before, body.paused *::after { animation-play-state: paused !important; }
  #pauseOv { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: rgba(30, 30, 60, .5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #pauseOv.hidden { display: none; }
  #pauseOv .pcard { width: min(400px, 100%); background: #fff; border-radius: 30px; padding: 24px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 14px 0 rgba(0, 0, 0, .15); color: #3b2a20; }
  #pauseOv .pcard div { font-size: 60px; line-height: 1; }
  #pauseOv h2 { margin: 0; font-size: 32px; }
  #pauseOv p { margin: 0; color: #7a6352; font-size: 17px; }
  #pauseOv .prow { display: flex; gap: 10px; }
  #pauseOv button { flex: 1; padding: 14px 10px; border-radius: 20px; font-size: 20px; font-weight: 700; color: #fff; background: #2fbf5a; box-shadow: 0 7px 0 #1d8a3e; }
  #pauseOv button.alt { background: #4fb6f0; box-shadow: 0 7px 0 #1a6fb0; }
  #pauseOv button:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
  @media (max-width: 420px) { .topbar .icon-btn { width: 40px; height: 40px; font-size: 20px; } .topbar { gap: 5px; } .progress i { width: 9px; font-size: 6px; } }
</style>
</head>
<body>

<main id="menu" class="screen">
  <div class="menu-card">
    <div class="menu-monsters" id="menuMonsters"></div>
    <h1>Monster-<span>Mampf</span></h1>
    <p class="tagline">Die Monster haben Hunger! Gib jeden Keks dem Monster mit der richtigen Zahl.</p>
    <p class="level-title">Was möchtest du rechnen?</p>
    <div class="levels" id="levels">
      <button data-level="1"><b>Plus</b><small>bis 10</small></button>
      <button data-level="2"><b>Plus &amp; Minus</b><small>bis 10</small></button>
      <button data-level="3"><b>Bis 20</b><small>ohne Übergang</small></button>
      <button data-level="4"><b>Bis 20</b><small>mit Übergang</small></button>
    </div>
    <div class="best" id="best"></div>
    <button class="big-btn" id="startBtn">🍪 Los geht's!</button>
    <a class="hub-link" href="zahlenraum-20.html">← Alle Spiele</a>
  </div>
</main>

<main id="game" class="screen hidden">
  <div class="wrap">
    <div class="topbar">
      <button class="icon-btn" id="homeBtn" aria-label="Zurück zum Menü">🏠</button>
      <div class="progress" id="progress"></div>
      <button class="icon-btn" id="pauseBtn" aria-label="Pause">⏸️</button>
      <button class="icon-btn" id="speakBtn" aria-label="Aufgabe vorlesen">🗣️</button>
      <button class="icon-btn" id="soundBtn" aria-label="Ton an/aus">🔊</button>
    </div>
    <div class="hint" id="hint">Welches Monster bekommt den Keks?</div>
    <div class="factory" id="factory">
      <div class="machine" id="machine"><div class="chimney"></div><span class="label">KEKS-O-MAT</span><div class="gauge"></div><div class="hole"></div></div>
      <div class="belt" id="belt"></div>
      <div class="bin" id="bin">🗑️</div>
      <div class="cookie hidden" id="cookie"><div class="disc"><i style="left:22%;top:20%"></i><i style="left:62%;top:16%"></i><i style="left:16%;top:62%"></i><i style="left:70%;top:60%"></i><i style="left:44%;top:78%"></i></div><div class="task" id="task"></div></div>
    </div>
    <div class="monsters" id="monsters"></div>
  </div>
</main>

<div class="overlay hidden" id="end">
  <div class="end-card" role="dialog" aria-modal="true" aria-labelledby="endTitle">
    <div style="font-size:64px" id="endEmoji">🏆</div>
    <h2 id="endTitle">Super!</h2>
    <div class="end-stars" id="endStars"></div>
    <p id="endText"></p>
    <div class="end-actions">
      <button class="big-btn" id="againBtn">🔁 Nochmal</button>
      <button class="big-btn alt" id="menuBtn">🏠 Menü</button>
    </div>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('monsterMampf.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('monsterMampf.' + k, JSON.stringify(v)); } catch (e) { /* egal */ } }
  };
  const ROUND = 10;

  // ---------- Aufgaben ----------
  function makeTask(level) {
    const add = level === 1 || Math.random() < 0.5;
    let a, b;
    if (level <= 2) {
      if (add) { a = rnd(1, 9); b = rnd(1, 10 - a); } else { a = rnd(2, 10); b = rnd(1, a - 1); }
    } else if (level === 3) {
      if (add) { const ua = rnd(1, 8), ub = rnd(1, 9 - ua); a = 10 + ua; b = ub; if (Math.random() < 0.3) [a, b] = [b, a]; }
      else { const ua = rnd(1, 9); a = 10 + ua; b = Math.random() < 0.15 ? 10 : rnd(1, ua); }
    } else {
      if (add) { a = rnd(2, 9); b = rnd(11 - a, 9); if (Math.random() < 0.5) [a, b] = [b, a]; }
      else { a = rnd(11, 18); b = rnd((a % 10) + 1, 9); }
    }
    const correct = add ? a + b : a - b;
    const max = level <= 2 ? 10 : 20;
    const set = new Set([correct]);
    for (const o of shuffle([-1, 1, -2, 2, -3, 3])) { if (set.size >= 3) break; const v = correct + o; if (v >= 0 && v <= max) set.add(v); }
    return { a, b, add, correct, text: `${a} ${add ? '+' : '−'} ${b}`, say: `${a} ${add ? 'plus' : 'minus'} ${b}`, choices: shuffle([...set]) };
  }

  // ---------- Sound ----------
  const sfx = (() => {
    let ctx = null, noiseBuf = null, on = store.get('sound', true);
    const ac = () => {
      if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    };
    function tone(f, start, dur, type = 'sine', vol = 0.18, to) {
      if (!on) return; const c = ac(); if (!c) return;
      const t = c.currentTime + start, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
    }
    function noise(start, dur, vol, freq) {
      if (!on) return; const c = ac(); if (!c) return;
      const t = c.currentTime + start, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f).connect(g).connect(c.destination); s.start(t); s.stop(t + dur + 0.05);
    }
    return {
      unlock: ac, get on() { return on; }, toggle() { on = !on; store.set('sound', on); return on; },
      click() { tone(520, 0, 0.07, 'triangle', 0.1); },
      plopp() { tone(700, 0, 0.12, 'sine', 0.2, 180); },
      chomp() { [0, 0.13, 0.26].forEach(s => noise(s, 0.09, 0.35, 900)); },
      burp() {
        if (!on) return; const c = ac(); if (!c) return;
        const t = c.currentTime, o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), g = c.createGain(), f = c.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(110, t); o.frequency.linearRampToValueAtTime(70, t + 0.7);
        lfo.frequency.value = 28; lg.gain.value = 25; lfo.connect(lg).connect(o.frequency);
        f.type = 'lowpass'; f.frequency.value = 600;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
        o.connect(f).connect(g).connect(c.destination); o.start(t); lfo.start(t); o.stop(t + 0.8); lfo.stop(t + 0.8);
      },
      nope() { tone(420, 0, 0.16, 'square', 0.07); tone(300, 0.16, 0.22, 'square', 0.07); },
      fall() { tone(1200, 0, 0.6, 'sine', 0.12, 250); noise(0.6, 0.25, 0.4, 500); },
      correct() { tone(660, 0, 0.12, 'triangle'); tone(990, 0.09, 0.2, 'triangle', 0.15); },
      win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.3, 'triangle', 0.16)); tone(1568, 0.6, 0.6, 'triangle', 0.12); }
    };
  })();

  const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  function speak(text) {
    if (!canSpeak) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; u.rate = 0.9; u.pitch = 1.2; speechSynthesis.speak(u); } catch (e) { /* egal */ }
  }

  // ---------- Konfetti ----------
  const confetti = (() => {
    const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], running = false;
    const resize = () => { const d = window.devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); };
    addEventListener('resize', resize); resize();
    function burst(x, y, n, colors, power = 8) {
      for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = Math.random() * power + 2; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - power * .5, r: Math.random() * 6 + 4, c: pick(colors), rot: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 1 }); }
      if (!running) { running = true; requestAnimationFrame(tick); }
    }
    function tick() {
      cx.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 30);
      parts.forEach(p => { p.vy += .3; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= .008; cx.save(); cx.globalAlpha = Math.min(1, p.life * 2); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * .66); cx.restore(); });
      if (parts.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0, 0, innerWidth, innerHeight); }
    }
    return { burst, rain() { for (let i = 0; i < 6; i++) setTimeout(() => burst(Math.random() * innerWidth, -10, 30, ['#ff5ea8', '#7c4dff', '#ffd23f', '#42d4f4', '#7ed957'], 4), i * 150); } };
  })();

  // ---------- Monster ----------
  const MONSTERS = [
    { name: 'Grummel', c: '#7ed957', hi: '#c8f7a8', dk: '#3f9a2a', eyes: 1, eye: '42%', extra: 'horns', d: '0s' },
    { name: 'Fluffi', c: '#ff8fc8', hi: '#ffd1ea', dk: '#d94f93', eyes: 2, eye: '28%', extra: 'antenna', d: '-.7s' },
    { name: 'Blubb', c: '#5ec8ff', hi: '#c4ecff', dk: '#1f8ccc', eyes: 3, eye: '22%', extra: 'horns', d: '-1.4s' }
  ];
  function monsterHTML(m, i) {
    const eyes = Array.from({ length: m.eyes }, () => '<span class="eye"><i></i><span class="lid"></span></span>').join('');
    const extra = m.extra === 'horns' ? '<span class="horn l"></span><span class="horn r"></span>' : '<span class="antenna"></span>';
    return `<button class="monster" data-i="${i}" aria-label="${m.name}" style="--c:${m.c};--hi:${m.hi};--dk:${m.dk};--eye:${m.eye};--d:${m.d}">
      <div class="bubble"></div>
      <div class="bodyw"><div class="body">${extra}<div class="eyes">${eyes}</div><div class="mouth"></div><div class="belly"></div></div></div>
      <div class="feet"><i></i><i></i></div>
    </button>`;
  }
  $('#menuMonsters').innerHTML = MONSTERS.map(monsterHTML).join('');
  $('#monsters').innerHTML = MONSTERS.map(monsterHTML).join('');
  const monsterEls = [...document.querySelectorAll('#monsters .monster')];
  document.querySelectorAll('#menuMonsters .belly').forEach((b, i) => b.textContent = ['7', '?', '5'][i]);

  function bubble(el, text, ms = 1600) {
    const b = el.querySelector('.bubble'); b.textContent = text; b.classList.add('show');
    clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('show'), ms);
  }
  function pulse(el, cls, ms) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); }

  // Blinzeln
  setInterval(() => {
    const all = document.querySelectorAll('.monster');
    const m = all[Math.floor(Math.random() * all.length)];
    m.classList.add('blink'); setTimeout(() => m.classList.remove('blink'), 140);
  }, 900);

  // ---------- Spielzustand ----------
  const state = { level: store.get('level', 1), idx: 0, results: [], q: null, wrong: 0, locked: true, x: 0, speed: 0, moving: false, eaten: [0, 0, 0], last: 0 };
  const cookie = $('#cookie'), factory = $('#factory');

  function renderMenu() {
    document.querySelectorAll('#levels button').forEach(b => b.classList.toggle('active', +b.dataset.level === state.level));
    const best = store.get('best.' + state.level, 0);
    $('#best').innerHTML = [1, 2, 3].map(i => i <= best ? '★' : '<span class="off">★</span>').join('');
  }
  $('#levels').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; sfx.unlock(); sfx.click(); state.level = +b.dataset.level; store.set('level', state.level); renderMenu(); });

  function show(id) { ['menu', 'game'].forEach(s => $('#' + s).classList.toggle('hidden', s !== id)); $('#end').classList.add('hidden'); scrollTo(0, 0); }

  function startRound() {
    sfx.unlock();
    state.idx = 0; state.results = []; state.eaten = [0, 0, 0];
    monsterEls.forEach(m => m.querySelector('.bodyw').style.setProperty('--fat', 1));
    show('game');
    $('#speakBtn').classList.toggle('hidden', !canSpeak);
    nextCookie(true);
  }

  function updateProgress() {
    $('#progress').innerHTML = Array.from({ length: ROUND }, (_, i) => {
      const r = state.results[i];
      return r === 'star' ? '<i class="star">⭐</i>' : r === 'ok' ? '<i class="ok">✓</i>' : `<i class="${i === state.idx ? 'now' : ''}"></i>`;
    }).join('');
  }
  function hint(text, cls = '') { const h = $('#hint'); h.textContent = text; h.className = 'hint ' + cls; }

  function nextCookie(first) {
    state.q = makeTask(state.level);
    state.wrong = 0;
    monsterEls.forEach((m, i) => { m.querySelector('.belly').textContent = state.q.choices[i]; m.classList.remove('wave', 'nope', 'open'); });
    updateProgress();
    hint(first ? 'Welches Monster bekommt den Keks?' : pick(['Der nächste Keks kommt!', 'Achtung, Keks!', 'Wer hat noch Hunger?']));
    sendCookie();
  }

  function sendCookie() {
    $('#task').textContent = state.q.text;
    const fw = factory.clientWidth;
    state.x = 30;
    // Das Band braucht je nach Stufe 10–14 Sekunden für die ganze Strecke
    state.speed = (fw + 40) / ((14 - state.level) * 1000);
    cookie.className = 'cookie';
    cookie.style.transform = `translateX(${state.x}px)`;
    cookie.style.opacity = '1';
    state.moving = true; state.locked = false;
    $('#belt').classList.remove('stop');
    pulse($('#machine'), 'shake', 400);
    const p = document.createElement('div'); p.className = 'puff'; p.style.left = '70px'; p.style.top = '30px'; factory.appendChild(p); setTimeout(() => p.remove(), 1400);
    sfx.plopp();
  }

  function loop(now) {
    const dt = state.last ? Math.min(50, now - state.last) : 16; state.last = now;
    if (state.moving && !(window.GamePause && GamePause.on)) {
      state.x += state.speed * dt;
      cookie.style.transform = `translateX(${state.x}px)`;
      const limit = factory.clientWidth - 80;
      if (state.x > limit) dropCookie();
    }
    // Augen folgen dem Keks
    if (!$('#game').classList.contains('hidden')) {
      const cr = cookie.getBoundingClientRect(), cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
      document.querySelectorAll('#monsters .eye').forEach(eye => {
        const r = eye.getBoundingClientRect(), dx = cx - (r.left + r.width / 2), dy = cy - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1, k = Math.min(r.width * 0.22, d);
        const pu = eye.firstElementChild; pu.style.setProperty('--px', (dx / d * k).toFixed(1) + 'px'); pu.style.setProperty('--py', (dy / d * k).toFixed(1) + 'px');
      });
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function dropCookie() {
    state.moving = false; state.locked = true;
    cookie.style.setProperty('--pos', `translateX(${state.x}px)`);
    cookie.classList.add('fall');
    sfx.fall();
    hint('Oh nein, in die Tonne! Der Keks kommt nochmal.', 'tip');
    setTimeout(() => pulse($('#bin'), 'bump', 400), 550);
    setTimeout(() => { if (!$('#game').classList.contains('hidden')) sendCookie(); }, 1500);
  }

  const NOPE = n => pick([`Nö! Ich will nur die ${n}!`, 'Bäh! Nicht meine Zahl!', 'Igitt, falscher Keks!', `Ich bin die ${n}!`]);
  const YUM = ['Mampf!', 'Lecker!', 'Mjam mjam!', 'Mehr davon!', 'Hmmm!'];

  function feed(i) {
    if (state.locked || (window.GamePause && GamePause.on)) return;
    sfx.unlock();
    const m = monsterEls[i], q = state.q, val = q.choices[i];
    if (val === q.correct) {
      state.locked = true; state.moving = false;
      $('#belt').classList.add('stop');
      const first = state.wrong === 0;
      state.results[state.idx] = first ? 'star' : 'ok';
      flyCookie(m, () => {
        sfx.chomp();
        m.classList.remove('open'); pulse(m, 'chomp', 1000);
        state.eaten[i]++;
        m.querySelector('.bodyw').style.setProperty('--fat', (1 + Math.min(7, state.eaten[i]) * 0.05).toFixed(2));
        const mr = m.getBoundingClientRect();
        confetti.burst(mr.left + mr.width / 2, mr.top + mr.height * .55, 18, ['#b97a3c', '#e0a560', '#5a2e10'], 6);
        bubble(m, pick(YUM));
        if (Math.random() < 0.35) setTimeout(() => { sfx.burp(); bubble(m, '*RÜLPS* 😆', 1300); }, 900);
        else pulse(m, 'happy', 1300);
        sfx.correct();
        hint(first ? pick(['Super!', 'Richtig!', 'Klasse gerechnet!', 'Toll!']) + ` ${q.text} = ${q.correct}` : `Richtig! ${q.text} = ${q.correct}`, 'good');
        state.idx++;
        updateProgress();
        setTimeout(() => state.idx >= ROUND ? endRound() : nextCookie(), 1700);
      });
    } else {
      state.wrong++;
      sfx.nope();
      pulse(m, 'nope', 700);
      bubble(m, NOPE(val));
      hint(q.add ? `Tipp: Zähle von ${q.a} aus ${q.b} weiter.` : `Tipp: Zähle von ${q.a} aus ${q.b} zurück.`, 'tip');
      if (state.wrong >= 2) {
        const right = monsterEls[q.choices.indexOf(q.correct)];
        right.classList.add('wave'); bubble(right, 'Hier! Ich! Ich!', 2500);
      }
    }
  }
  monsterEls.forEach((m, i) => m.addEventListener('click', () => feed(i)));

  function flyCookie(m, done) {
    m.classList.add('open'); m.classList.remove('wave');
    const cr = cookie.getBoundingClientRect(), mouth = m.querySelector('.mouth').getBoundingClientRect();
    const dx = (mouth.left + mouth.width / 2) - (cr.left + cr.width / 2), dy = (mouth.top + mouth.height / 2) - (cr.top + cr.height / 2);
    const base = `translateX(${state.x}px)`;
    if (cookie.animate) {
      const anim = cookie.animate([
        { transform: `${base} translate(0,0) scale(1)` },
        { transform: `${base} translate(${dx * .5}px, ${dy * .5 - 90}px) scale(.9) rotate(180deg)` },
        { transform: `${base} translate(${dx}px, ${dy}px) scale(.25) rotate(360deg)` }
      ], { duration: 650, easing: 'cubic-bezier(.3,.1,.5,1)', fill: 'forwards' });
      anim.onfinish = () => { cookie.classList.add('hidden'); anim.cancel(); done(); };
    } else { cookie.classList.add('hidden'); done(); }
  }

  function endRound() {
    const first = state.results.filter(r => r === 'star').length;
    const stars = first >= 9 ? 3 : first >= 6 ? 2 : 1;
    const key = 'best.' + state.level;
    if (stars > store.get(key, 0)) store.set(key, stars);
    $('#endTitle').textContent = ['Gut gemacht!', 'Sehr gut!', 'Monster-stark!'][stars - 1];
    $('#endEmoji').textContent = ['😋', '🥈', '🏆'][stars - 1];
    $('#endStars').innerHTML = [1, 2, 3].map(i => `<span class="${i <= stars ? 'on' : ''}" style="animation-delay:${.2 + i * .22}s">★</span>`).join('');
    const total = state.eaten.reduce((a, b) => a + b, 0);
    const fattest = MONSTERS[state.eaten.indexOf(Math.max(...state.eaten))].name;
    $('#endText').textContent = `${first} von ${ROUND} Keksen beim ersten Versuch richtig! ${fattest} hat am meisten gefuttert.`;
    $('#end').classList.remove('hidden');
    sfx.win(); confetti.rain();
    if (total) setTimeout(() => sfx.burp(), 1200);
  }

  function goMenu() { state.moving = false; state.locked = true; if (canSpeak) speechSynthesis.cancel(); renderMenu(); show('menu'); }
  $('#startBtn').addEventListener('click', () => { sfx.click(); startRound(); });
  $('#againBtn').addEventListener('click', () => { sfx.click(); startRound(); });
  $('#menuBtn').addEventListener('click', goMenu);
  $('#homeBtn').addEventListener('click', goMenu);
  $('#speakBtn').addEventListener('click', () => state.q && speak(state.q.say));
  const renderSound = () => { $('#soundBtn').textContent = sfx.on ? '🔊' : '🔇'; };
  $('#soundBtn').addEventListener('click', () => { sfx.toggle(); renderSound(); sfx.click(); });
  document.addEventListener('keydown', e => {
    if ($('#game').classList.contains('hidden') || !$('#end').classList.contains('hidden')) return;
    const n = parseInt(e.key, 10); if (n >= 1 && n <= 3) feed(n - 1);
    if (e.key === 'Escape') goMenu();
  });
  renderSound();
  renderMenu();
})();
</script>

<div id="pauseOv" class="hidden" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="pcard"><div>⏸️</div><h2 id="pTitle">Pause</h2><p>Kurz durchatmen! Das Spiel wartet auf dich.</p>
    <div class="prow"><button id="pResume">▶ Weiter</button><button class="alt" id="pMenu">🏠 Menü</button></div></div>
</div>
<script>
  // Pause: hält Animationen, Bewegungen und Zeit an
  (() => {
    const ov = document.getElementById('pauseOv'); let on = false, frozen = [], since = 0;
    window.GamePause = {
      get on() { return on; },
      set(v) {
        if (v === on) return; on = v;
        document.body.classList.toggle('paused', v); ov.classList.toggle('hidden', !v);
        if (document.getAnimations) {
          if (v) { frozen = document.getAnimations().filter(a => a.playState === 'running'); frozen.forEach(a => { try { a.pause(); } catch (e) {} }); }
          else { frozen.forEach(a => { try { if (a.playState === 'paused') a.play(); } catch (e) {} }); frozen = []; }
        }
        if (v && 'speechSynthesis' in window) speechSynthesis.cancel();
        const ms = v ? 0 : performance.now() - since; if (v) since = performance.now();
        document.dispatchEvent(new CustomEvent('gamepause', { detail: { paused: v, ms } }));
      }
    };
    const inGame = () => !document.getElementById('game').classList.contains('hidden') && document.getElementById('end').classList.contains('hidden');
    document.getElementById('pauseBtn').addEventListener('click', () => { if (inGame()) GamePause.set(true); });
    document.getElementById('pResume').addEventListener('click', () => GamePause.set(false));
    document.getElementById('pMenu').addEventListener('click', () => { GamePause.set(false); document.getElementById('homeBtn').click(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden && inGame()) GamePause.set(true); });
    document.addEventListener('keydown', e => { if ((e.key === 'p' || e.key === 'P') && inGame()) GamePause.set(!on); }, true);
  })();
</script>
</body>
