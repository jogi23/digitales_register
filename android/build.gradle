allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Workaround for old Flutter plugins that have no namespace in build.gradle (AGP 8.x requirement)
    afterEvaluate {
        if (it.hasProperty('android') && !it.android.hasProperty('namespace')) {
            def manifestFile = it.android.sourceSets.main.manifest.srcFile
            if (manifestFile != null && manifestFile.exists()) {
                def xmlSlurper = new groovy.xml.XmlSlurper()
                def manifest = xmlSlurper.parse(manifestFile)
                def packageAttr = manifest['@package']
                if (packageAttr && !packageAttr.toString().isEmpty()) {
                    it.android.namespace = packageAttr.toString()
                }
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
