# build.yaml — protect hand-maintained .g.dart files from being wiped by build_runner
#
# The local built_redux package has no code generator.
# The _$XxxActions and XxxActionsNames classes in lib/actions/*.g.dart are
# maintained manually. This config excludes those files from built_value
# output so build_runner never overwrites the full .g.dart files.
#
# If you need to re-run codegen, use:
#   dart run build_runner build
# This will only regenerate built_value parts (.g.part cache) and merge them.
# The built_redux sections must NOT be deleted.

targets:
  $default:
    builders:
      built_value_generator|built_value:
        generate_for:
          exclude:
            # Action files that have hand-maintained built_redux boilerplate.
            # built_value only generates for the Built<> payload classes in
            # dashboard_actions, grades_actions, login_actions, profile_actions,
            # routing_actions — but we exclude the others to prevent empty file
            # generation that could delete the redux boilerplate.
            - lib/actions/absences_actions.dart
            - lib/actions/app_actions.dart
            - lib/actions/calendar_actions.dart
            - lib/actions/certificate_actions.dart
            - lib/actions/dashboard_actions.dart
            - lib/actions/grades_actions.dart
            - lib/actions/login_actions.dart
            - lib/actions/messages_actions.dart
            - lib/actions/notifications_actions.dart
            - lib/actions/profile_actions.dart
            - lib/actions/routing_actions.dart
            - lib/actions/save_pass_actions.dart
            - lib/actions/settings_actions.dart
